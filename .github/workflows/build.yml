name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.41.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter doctor -v
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Create .env for analysis
        run: touch example/.env

      - name: Verify CHANGELOG is updated
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')

          # Get the base branch version (main for PRs, previous commit for pushes)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            BASE_VERSION=$(git show origin/${{ github.base_ref }}:pubspec.yaml | grep '^version:' | sed 's/version: //' | tr -d ' ')
          else
            BASE_VERSION=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | sed 's/version: //' | tr -d ' ' || echo "$CURRENT_VERSION")
          fi

          echo "Base version: $BASE_VERSION"
          echo "Current version: $CURRENT_VERSION"

          # Only check CHANGELOG if version was updated
          if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
            echo "Version was updated from $BASE_VERSION to $CURRENT_VERSION"
            if ! grep -q "## \[$CURRENT_VERSION\]" CHANGELOG.md; then
              echo "Error: CHANGELOG.md does not contain version $CURRENT_VERSION"
              echo "Please update CHANGELOG.md to include an entry for version $CURRENT_VERSION"
              exit 1
            fi
            echo "✓ CHANGELOG.md contains version $CURRENT_VERSION"
          else
            echo "✓ Version unchanged, skipping CHANGELOG check"
          fi

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  pana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Run pana score check
        # Fail if the package scores more than 40 points below the maximum
        run: dart pub global run pana --no-warning --exit-code-threshold 40 .

  build-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env for example
        run: touch example/.env

      - name: Build example app (Android)
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  build-example-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create .env for example
        run: touch example/.env

      - name: Update CocoaPods specs repo
        run: pod repo update

      - name: Build example app (iOS, no codesign)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
